name: Deploy Backend to Azure VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

     - name: Verify Dockerfile exist
       run: |
          pwd
          ls -la
          test -f Dockerfile && echo "Dockerfile FOUND" || echo "Dockerfile MISSING"

    - name: Build Docker image
      run: docker build --file Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/interview-backend:latest .

      
    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/interview-backend:latest

    - name: Deploy on Azure VM
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/interview-backend:latest
          docker stop interview-backend || true
          docker rm interview-backend || true
          docker run -d --name interview-backend -p 8001:8000 --restart unless-stopped ${{ secrets.DOCKER_USERNAME }}/interview-backend:latest
